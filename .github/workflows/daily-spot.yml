name: Daily spot prices

on:
  schedule:
    - cron: "5 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update spot prices (1 API call)
        run: node scripts/fetch-data.mjs --spot
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Commit changes if any
        run: |
          git config user.name "coinrewind-bot"
          git config user.email "coinrewind-bot@users.noreply.github.com"
          git add public/data/prices
          if git diff --staged --quiet; then
            echo "No price changes"
          else
            git commit -m "chore: daily spot prices"
            git push
          fi
