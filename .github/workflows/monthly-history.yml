name: Monthly history refresh

on:
  schedule:
    - cron: "15 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh official daily closes (20 API calls)
        run: node scripts/fetch-data.mjs
        env:
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}

      - name: Commit changes if any
        run: |
          git config user.name "coinrewind-bot"
          git config user.email "coinrewind-bot@users.noreply.github.com"
          git add public/data/prices
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: monthly history refresh"
            git push
          fi
